    const stage = gallery?.querySelector('.home-gallery__stage');
    const slide = stage?.querySelector('.home-gallery__slide');
    if (gallery && controls && stage && slide) {
      if (gallery.dataset.previewPaused === undefined) gallery.dataset.previewPaused = String(window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      const sync = () => {
        const paused = gallery.dataset.previewPaused === 'true';
        gallery.dataset.slideshowPaused = String(paused);
        const label = paused ? 'Play slideshow' : 'Pause slideshow';
        const toggleButton = controls.querySelector('.home-gallery__toggle');
        if (toggleButton) { const icon = paused ? '▶' : 'Ⅱ'; if (toggleButton.textContent !== icon) toggleButton.textContent = icon; toggleButton.setAttribute('aria-label', label); toggleButton.setAttribute('aria-pressed', String(paused)); toggleButton.title = label; }
        const cardButton = stage.querySelector('.home-image-card');
        if (cardButton) { cardButton.setAttribute('aria-label', paused ? 'Play slideshow' : 'Pause slideshow'); cardButton.title = paused ? 'Play slideshow' : 'Pause slideshow'; }
      };
      let toggleButton = controls.querySelector('.home-gallery__toggle');
      if (!toggleButton) { toggleButton = document.createElement('button'); toggleButton.type = 'button'; toggleButton.className = 'home-gallery__nav home-gallery__toggle'; controls.append(toggleButton); }
      toggleButton.style.display = 'none';
      if (!toggleButton.dataset.bound) { toggleButton.dataset.bound = 'true'; toggleButton.addEventListener('click', () => { gallery.dataset.previewPaused = String(gallery.dataset.previewPaused !== 'true'); enhance(); }); }
      if (gallery.dataset.previewSlideIndex === undefined) gallery.dataset.previewSlideIndex = '0';
      const setPreviewSlide = (index) => {
        const slideIndex = (index + 5) % 5; gallery.dataset.previewSlideIndex = String(slideIndex);
        const currentSlide = stage.querySelector('.home-gallery__slide'); const card = currentSlide?.querySelector('.home-image-card');
        if (currentSlide) currentSlide.setAttribute('aria-label','Card ' + (slideIndex + 1) + ' of 5');
        if (card) { card.dataset.previewSlide = String(slideIndex + 1); card.setAttribute('aria-label',gallery.dataset.previewPaused === 'true' ? 'Play slideshow' : 'Pause slideshow'); }
        controls.querySelectorAll('.home-gallery__dot').forEach((dot,dotIndex) => dot.setAttribute('aria-pressed',String(dotIndex === slideIndex)));
      };
      if (!gallery.dataset.previewFiveBound) {
        gallery.dataset.previewFiveBound = 'true';
        controls.addEventListener('click',(event) => { const button = event.target.closest('button'); if (!button) return; const current = Number(gallery.dataset.previewSlideIndex || 0); if (button.getAttribute('aria-label') === 'Show next image') setPreviewSlide(current + 1); if (button.getAttribute('aria-label') === 'Show previous image') setPreviewSlide(current - 1); });
      }
      const dots = controls.querySelector('.home-gallery__dots');
      if (dots && (dots.children.length !== 5 || !dots.firstElementChild?.getAttribute('aria-label')?.startsWith('Show card'))) { dots.replaceChildren(); for (let index = 0; index < 5; index += 1) { const dot = document.createElement('button'); dot.type = 'button'; dot.className = 'home-gallery__dot'; dot.setAttribute('aria-label','Show card ' + (index + 1)); dot.setAttribute('aria-pressed','false'); dot.addEventListener('click',() => setPreviewSlide(index)); dots.append(dot); } }
      setPreviewSlide(Number(gallery.dataset.previewSlideIndex || 0));
      if (!gallery.dataset.autoplayBound) { gallery.dataset.autoplayBound = 'true'; window.setInterval(() => { const nextButton = gallery.querySelector('.home-gallery__slide-nav--next') || controls.querySelector('[aria-label="Show next image"]'); if (gallery.dataset.previewPaused !== 'true' && nextButton) nextButton.click(); }, 5000); }
      if (!stage.dataset.pauseClickBound) {
        stage.dataset.pauseClickBound = 'true';
        stage.addEventListener('click', (event) => { const cardButton = event.target.closest('.home-image-card'); if (cardButton && !event.target.closest('button')) { gallery.dataset.previewPaused = String(gallery.dataset.previewPaused !== 'true'); enhance(); } });
        stage.addEventListener('keydown', (event) => { const cardButton = event.target.closest('.home-image-card'); if (cardButton && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); gallery.dataset.previewPaused = String(gallery.dataset.previewPaused !== 'true'); enhance(); } });
      }
      const currentCard = slide.querySelector('.home-image-card');
      if (currentCard && !currentCard.hasAttribute('role')) { currentCard.setAttribute('role','button'); currentCard.setAttribute('tabindex','0'); }
      for (const direction of ['previous','next']) {
        if (slide.querySelector('.home-gallery__slide-nav--' + direction)) continue;
        const originalButton = controls.querySelector('[aria-label="Show ' + direction + ' image"]');
        if (!originalButton) continue;
        originalButton.style.display = 'none';
        const overlayButton = document.createElement('button'); overlayButton.type = 'button'; overlayButton.className = 'home-gallery__slide-nav home-gallery__slide-nav--' + direction; overlayButton.setAttribute('aria-label','Show ' + direction + ' image'); overlayButton.innerHTML = originalButton.innerHTML; overlayButton.addEventListener('click', () => originalButton.click()); slide.append(overlayButton);
      }
      sync();
    }
    document.querySelectorAll('.aspect-video').forEach((visionCard) => { if (visionCard.textContent.includes('Vision video')) visionCard.classList.add('about-vision-card'); });
  };
  const observer = new MutationObserver(enhance);
  observer.observe(document.documentElement,{childList:true,subtree:true});
  enhance();
})();
</script>
<script>
(() => {
  const ready = () => {
    const desktopTimer = Array.from(document.querySelectorAll('[aria-label="NEET UG Countdown Urgency Timer"]')).find((node) => node.className.includes('hidden sm:inline-flex'));

      document.head.append(linkStyle);
    }

    document.head.append(responsive);
    const group = document.createElement('div');
    group.id = 'air-neetwork-actions';
    group.style.cssText = 'display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 0 auto';

    const community = document.createElement('button');
